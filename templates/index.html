<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 智慧溫溼度監測系統</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f1f5f9;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .status-badge {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card-label {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-value {
            font-size: 3.5rem;
            font-weight: 600;
        }

        .unit {
            font-size: 1.5rem;
            color: #64748b;
        }

        .chart-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            height: 400px;
            position: relative;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pulse {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(34, 197, 94, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>ESP32 Dashboard</h1>
            <div class="status-indicator">
                <span class="pulse"></span>
                <span class="status-badge">即時監測中</span>
            </div>
        </header>

        <div class="stats-grid">
            <div class="card">
                <div class="card-label">🌡️ 溫度</div>
                <div class="card-value" id="temp-val">-- <span class="unit">°C</span></div>
            </div>
            <div class="card">
                <div class="card-label">💧 濕度</div>
                <div class="card-value" id="hum-val">-- <span class="unit">%</span></div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="sensorChart"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('sensorChart').getContext('2d');
        let chart;

        function initChart(data) {
            const labels = data.map(d => d.timestamp.split(' ')[1]);
            const temps = data.map(d => d.temperature);
            const hums = data.map(d => d.humidity);

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '溫度 (°C)',
                            data: temps,
                            borderColor: '#818cf8',
                            backgroundColor: 'rgba(129, 140, 248, 0.1)',
                            fill: true,
                            tension: 0.4,
                            yAxisID: 'y'
                        },
                        {
                            label: '濕度 (%)',
                            data: hums,
                            borderColor: '#c084fc',
                            backgroundColor: 'rgba(192, 132, 252, 0.1)',
                            fill: true,
                            tension: 0.4,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#94a3b8', font: { family: 'Outfit' } } }
                    },
                    scales: {
                        x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#64748b' } },
                        y: {
                            position: 'left',
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#818cf8' },
                            title: { display: true, text: '溫度', color: '#818cf8' }
                        },
                        y1: {
                            position: 'right',
                            grid: { display: false },
                            ticks: { color: '#c084fc' },
                            title: { display: true, text: '濕度', color: '#c084fc' }
                        }
                    }
                }
            });
        }

        async function updateData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();

                if (data.length > 0) {
                    const latest = data[data.length - 1];
                    document.getElementById('temp-val').innerHTML = `${latest.temperature} <span class="unit">°C</span>`;
                    document.getElementById('hum-val').innerHTML = `${latest.humidity} <span class="unit">%</span>`;

                    if (!chart) {
                        initChart(data);
                    } else {
                        chart.data.labels = data.map(d => d.timestamp.split(' ')[1]);
                        chart.data.datasets[0].data = data.map(d => d.temperature);
                        chart.data.datasets[1].data = data.map(d => d.humidity);
                        chart.update('none');
                    }
                }
            } catch (err) {
                console.error('Fetch error:', err);
            }
        }

        // 每 2 秒更新一次數據
        setInterval(updateData, 2000);
        updateData();
    </script>
</body>

</html>
